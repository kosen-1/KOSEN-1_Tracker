name: Update TLE

on:
  schedule:
    - cron: '17 */6 * * *'   # 6 時間ごと（CelesTrak の 2 時間ルールより十分ゆるく）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TLE (CelesTrak → SatNOGS)
        run: |
          set -e
          if curl -sf "https://celestrak.org/NORAD/elements/gp.php?CATNR=49402&FORMAT=TLE" -o new.txt \
             && grep -q '^1 49402' new.txt && grep -q '^2 49402' new.txt; then
            echo "source: CelesTrak"
          else
            curl -sf "https://db.satnogs.org/api/tle/?norad_cat_id=49402" \
              | python3 -c "import json,sys;d=json.load(sys.stdin)[0];print(d['tle0'].removeprefix('0 '));print(d['tle1']);print(d['tle2'])" > new.txt
            grep -q '^1 49402' new.txt && grep -q '^2 49402' new.txt
            echo "source: SatNOGS"
          fi
          tr -d '\r' < new.txt | sed 's/[[:space:]]*$//' > tle.txt
          rm new.txt
          cat tle.txt
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tle.txt
          git diff --cached --quiet || git commit -m "TLE 更新 $(date -u +%Y-%m-%dT%H:%MZ)" && git push
